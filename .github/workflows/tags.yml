name: CI-TAG

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.ALIBABA_REGISTRY }}
          username: ${{ secrets.ALIBABA_USERNAME }}
          password: ${{ secrets.ALIBABA_PASSWORD }}

      - name: Extract branch or tag name
        shell: bash
        run: echo "REF_NAME=$(echo ${GITHUB_REF#refs/*/} | sed 's/\//-/g')" >> $GITHUB_ENV

      - name: Create env file
        run: |
          touch .env
          echo TAG_VERSION=${{ env.REF_NAME }} >> .env

      - name: Build and push Docker image - Test
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'test')
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ALIBABA_REGISTRY }}/dev/vp_front:${{ env.REF_NAME }}
          build-args: |
            RELEASE_ENV=test

      - name: Build and push Docker image - UAT
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'uat')
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ALIBABA_REGISTRY }}/dev/vp_front:${{ env.REF_NAME }}
          build-args: |
            RELEASE_ENV=uat

      - name: Build and push Docker image - RC
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'rc')
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ALIBABA_REGISTRY }}/dev/vp_front:${{ env.REF_NAME }}
          build-args: |
            RELEASE_ENV=rc

      - name: Build and push Docker image - Prod
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, 'uat')
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ALIBABA_REGISTRY }}/dev/vp_front:${{ env.REF_NAME }}-prod
          build-args: |
            RELEASE_ENV=prod

      - name: Get tag version
        id: get_tag_version
        run: echo "::set-output name=tag_version::${{ github.ref_name }}"
